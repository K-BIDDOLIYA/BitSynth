<!DOCTYPE html>
<html>
<title>BitSynth</title>
<style>
body{font:15px Arial;background:#f5f5f5;color:#222;margin:20px}
main{max-width:600px;margin:auto;background:white;padding:20px;border:1px solid #ddd;border-radius:10px}
h2{margin-top:0}
#p{display:flex;overflow:auto;padding:8px 0}
.key{min-width:40px;height:125px;border:1px solid #bbb;display:flex;align-items:end;justify-content:center;padding-bottom:8px;box-sizing:border-box;border-radius:0 0 5px 5px}
.black{background:#222;color:white;margin-right:-1px}
.active{background:#8ad9ff}
input{accent-color:#168bd2}
#s{background:#f2f2f2;padding:10px;border-radius:5px}
</style>
<main>
<h2>🎹 BitSynth</h2>
<p>Shift: octave up | Ctrl + Shift: down</p>
<p>Octave: <b id="o">4</b>　Volume: <input id="v" type="range" min="0" max="100" value="30"></p>
<div id="p"></div>
<p id="s">Ready to play</p>
<small>Use A W S E D F T G Y H U J K</small>
</main>
<script>
let a=new AudioContext(),o=4,n={},keys="AWSEDFTGYHUJK",p=document.getElementById("p");
function play(k,i){
if(n[k])return;
a.resume();
let x=a.createOscillator(),g=a.createGain();
x.frequency.value=261.63*2**(o-4+i/12);
g.gain.value=v.value/100*.3;
x.connect(g);g.connect(a.destination);x.start();n[k]=[x,g];
s.textContent="Playing: "+Object.keys(n).join(", ");
p.children[keys.indexOf(k)].classList.add("active");
}
function stop(k){
if(!n[k])return;
n[k][1].gain.setTargetAtTime(0,a.currentTime,.03);
n[k][0].stop(a.currentTime+.15);delete n[k];
p.children[keys.indexOf(k)].classList.remove("active");
s.textContent=Object.keys(n).join(", ")||"Ready to play";
}
[...keys].forEach((k,i)=>{
let b=document.createElement("div");
b.className="key "+([1,3,6,8,10].includes(i)?"black":"");
b.textContent=k;p.append(b);
b.onpointerdown=e=>{e.preventDefault();play(k,i)};
b.onpointerup=()=>stop(k);
b.onpointerleave=()=>stop(k);
});
onkeydown=e=>{
if(e.repeat)return;
if(e.ctrlKey&&e.shiftKey&&e.key==="Shift")o=Math.max(1,o-1);
else if(e.key==="Shift"&&!e.ctrlKey)o=Math.min(7,o+1);
else if(keys.includes(e.key.toUpperCase()))play(e.key.toUpperCase(),keys.indexOf(e.key.toUpperCase()));
document.getElementById("o").textContent=o;
};
onkeyup=e=>stop(e.key.toUpperCase());
v.oninput=()=>Object.values(n).forEach(x=>x[1].gain.setTargetAtTime(v.value/100*.3,a.currentTime,.02));
</script>
</html>
